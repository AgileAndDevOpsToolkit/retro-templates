        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        h1 { text-align: center; }
        h2 { margin-top: 40px; color: #333; text-align: center; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 300px;
        }
        .card img {
            max-width: 300px;
            max-height: 300px;
            width: auto;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .card img:hover { transform: scale(1.05); }
        .download-link {
            margin-top: 8px;
            text-decoration: none;
            color: #007BFF;
            font-size: 0.9em;
        }
        .download-link:hover {
            text-decoration: underline;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 999;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.9);
        }
        .lightbox img {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80%;
        }
    </style>
